# Configuración de caché para Nginx
# Coloca esta configuración en tu archivo nginx.conf o en un archivo de sitio

server {
    listen 80;
    server_name tu-dominio.com;
    root /ruta/a/dist/wedding-invitation-tmp/browser;
    index index.html;

    # Compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Caché para recursos estáticos con hash (1 año)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|ttf|otf|woff|woff2|css|js|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fuentes - 1 año
    location ~* \.(ttf|otf|woff|woff2|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # CSS y JS con hash - 1 año
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Videos - 1 año
    location ~* \.(mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML sin caché
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Angular routing - todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
