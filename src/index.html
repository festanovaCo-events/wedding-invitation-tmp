<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Boda de Jorge & Yina - Invitación Digital | 12 de Septiembre 2026</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Meta Tags - No indexar en buscadores -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">

  <!-- Fuentes incluidas inline en el bundle (fonts-inline.generated.css) -->

  <!-- Preload de animación de música con prioridad baja para no bloquear la ruta crítica -->
  <link rel="preload" href="/assets/animations/music.json" as="fetch" crossorigin fetchpriority="low">

  <!-- Script para convertir CSS de librerías en carga asíncrona -->
  <script>
    (function () {
      // Lista de CSS que deben cargarse de forma asíncrona (no críticos)
      const asyncCSS = [
        'fancybox.css',
        'slick.css',
        'slick-theme.css'
      ];

      const processedLinks = new Set();

      function makeCSSAsync(link) {
        // Evitar procesar el mismo link múltiples veces
        if (processedLinks.has(link)) {
          return;
        }

        const href = link.getAttribute('href') || '';
        // Si el CSS es de una librería no crítica, cargarlo de forma asíncrona
        if (asyncCSS.some(function (css) { return href.includes(css); })) {
          processedLinks.add(link);

          // Si ya tiene media='all', cambiarlo a 'print' para carga asíncrona
          if (link.media === 'all' || !link.media) {
            link.media = 'print';
            link.onload = function () {
              this.media = 'all';
            };
            // Forzar recarga si ya estaba cargado
            if (link.sheet) {
              link.href = link.href;
            }
          }
        }
      }

      function processAllLinks() {
        const links = document.querySelectorAll('link[rel="stylesheet"]');
        links.forEach(makeCSSAsync);
      }

      // Observar cambios en el head para detectar CSS inyectado por Angular
      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node.nodeName === 'LINK' && node.rel === 'stylesheet') {
              makeCSSAsync(node);
            }
          });
        });
      });

      // Iniciar observación del head
      observer.observe(document.head, {
        childList: true,
        subtree: false
      });

      // Procesar links existentes
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', processAllLinks);
      } else {
        processAllLinks();
      }

      // También procesar después de un delay para capturar CSS inyectado por Angular
      setTimeout(processAllLinks, 50);
      setTimeout(processAllLinks, 200);
    })();
  </script>
</head>

<body>
  <!-- Splash crítico: visible inmediatamente, se oculta cuando Angular bootstrapea -->
  <div id="app-splash"
    style="position:fixed;inset:0;background:#6c86ab;display:flex;align-items:center;justify-content:center;z-index:9999">
    <div
      style="width:60px;height:60px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:app-splash-spin 1s linear infinite">
    </div>
  </div>
  <style>
    @keyframes app-splash-spin {
      to {
        transform: rotate(360deg)
      }
    }
  </style>
  <app-root></app-root>
</body>

</html>
