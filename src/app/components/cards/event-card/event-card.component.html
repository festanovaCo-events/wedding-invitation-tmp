<div class="flex flex-col justify-center items-center gap-9">
  <div class="flex flex-col gap-5">
    <div class="p-[25px] w-[175px] h-[175px] bg-white rounded-half shadow-rounded">
      <div class="w-28 h-28 mx-auto">
        <ng-lottie [options]="options" (animationCreated)="animationCreated($event)" />
      </div>
    </div>

    <h3
      class="text-white text-[35px] md:text-[40px] bg-navy text-center belt-img relative inline-block leading-[1.2] font-cookie">
      {{ titulo }}
    </h3>
  </div>

  <div class="flex flex-col justify-center items-center gap-2">
    <h6 class="text-navy font-bold text-[22px] md:text-[25px]">Día</h6>
    <p class="text-navy font-normal text-base md:text-base lg:text-xl px-4 text-center">{{ date }}</p>

    <a [href]="calendarRef" target="_blank" rel="noopener noreferrer"
      class="mt-4 bg-white text-navy text-center font-bold rounded-[50px] text-[14px] md:text-[15px] py-[11px] md:py-[13px] px-[28px] md:px-[30px]
      shadow-[0px_0px_5px_-1px_rgba(0,0,0,0.40)] transition-all hover:bg-navy hover:text-white leading-[15px] inline-block cursor-pointer">
      Agendar
    </a>
  </div>

  <div class="flex flex-col justify-center items-center gap-2">
    <h6 class="text-navy font-bold text-[22px] md:text-[25px]">Lugar</h6>
    <p class="text-navy font-normal text-base md:text-base lg:text-xl px-4 text-center">{{ place }}</p>
  </div>

  <div class="flex flex-col justify-center items-center gap-2">
    <h6 class="text-navy font-bold text-[22px] md:text-[25px]">Dirección</h6>
    <p class="text-navy font-normal text-base md:text-base lg:text-xl px-4 text-center">{{ address }}</p>

    <a [href]="mapsUrl || 'https://www.google.com/maps/search/?api=1&query=' + location" target="_blank"
      rel="noopener noreferrer"
      class="mt-4 bg-white text-navy text-center font-bold rounded-[50px] text-[14px] md:text-[15px] py-[11px] md:py-[13px] px-[28px] md:px-[30px]
      shadow-[0px_0px_5px_-1px_rgba(0,0,0,0.40)] transition-all hover:bg-navy hover:text-white leading-[15px] inline-block cursor-pointer">
      ¿Cómo llegar?
    </a>
  </div>
</div>
