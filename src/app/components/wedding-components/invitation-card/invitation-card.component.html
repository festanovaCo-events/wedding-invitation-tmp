<section class="w-full bg-white border border-theme-border rounded-3xl overflow-hidden shadow-sm">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
    class="w-full flex items-center justify-between px-6 py-5 hover:bg-surface-alt/60 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 cursor-pointer"
  >
    <div class="flex items-center gap-3">
      <svg
        class="w-4 h-4 text-primary"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"
        />
      </svg>
      <span class="font-cookie text-xl text-heading">
        Ver la invitación de todos modos
      </span>
    </div>

    <svg
      class="w-4 h-4 text-muted transition-transform"
      [class.rotate-180]="isOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div *ngIf="isOpen" class="border-t border-theme-border">
    <div class="h-1.5 w-full bg-accent/30"></div>

    <div class="flex items-center justify-between px-5 py-3 bg-surface-alt border-b border-accent/20">
      <p class="text-xs text-muted leading-relaxed">
        Solo lectura — ya no estás confirmado para asistir
      </p>
      <a
        *ngIf="openInNewTabUrl"
        [href]="openInNewTabUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center gap-1.5 text-xs text-primary hover:text-primary-soft hover:underline shrink-0 ml-4"
      >
        Abrir en nueva pestaña
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"
          />
        </svg>
      </a>
    </div>

    <div class="w-full h-[680px] bg-surface-alt/40 relative">
      <iframe
        *ngIf="safeIframeUrl"
        [src]="safeIframeUrl"
        title="Invitación de boda"
        class="w-full h-full border-0"
        [class.pointer-events-none]="!iframeInteractive"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
      ></iframe>

      <!-- Evita que el iframe capture el scroll; un clic habilita la interacción -->
      <div
        *ngIf="!iframeInteractive"
        class="absolute inset-0 z-10"
        (click)="enableIframeInteraction()"
        role="presentation"
        aria-hidden="true"
      ></div>
    </div>

    <div class="h-1.5 w-full bg-accent/30"></div>
  </div>
</section>
