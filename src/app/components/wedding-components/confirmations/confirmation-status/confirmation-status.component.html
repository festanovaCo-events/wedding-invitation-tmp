<div class="flex flex-col items-center justify-center gap-4 px-4 w-full">
    <div
        class="flex items-center justify-center w-20 h-20 md:w-24 md:h-24 rounded-full bg-green-100 mb-2 animate-pulse">
        <svg class="w-10 h-10 md:w-12 md:h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>

    <h2 class="text-navy font-bold text-xl md:text-2xl lg:text-3xl text-center font-cookie">
        ¡Ya confirmaste tu asistencia!
    </h2>
    <p class="text-navy text-sm md:text-base lg:text-lg text-center max-w-md">
        Estamos emocionados de celebrar contigo este día especial.
    </p>

    <div *ngIf="confirmedGuestNames.length > 0" class="mt-4 flex flex-col items-center gap-3 w-full max-w-xs">
        <div
            class="flex items-center justify-center w-12 h-12 md:w-14 md:h-14 rounded-full bg-navy text-white text-xl md:text-2xl font-bold">
            {{ confirmedGuestNames.length }}
        </div>

        <h3 class="text-navy font-bold text-base md:text-lg uppercase tracking-wider">
            Invitado(s) Confirmado(s)
        </h3>

        <ul class="flex flex-col gap-2 w-full">
            <li *ngFor="let name of confirmedGuestNames"
                class="bg-sand text-navy text-sm md:text-base text-center py-3 px-4 rounded-lg capitalize">
                {{ name }}
            </li>
        </ul>
    </div>
</div>
