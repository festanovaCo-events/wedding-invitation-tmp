<div class="m02-gifts">
  <div class="m02-gifts__icon" aria-hidden="true">
    <hugeicons-icon
      [icon]="icons.gift"
      [size]="40"
      color="currentColor"
      [strokeWidth]="1.4"
    ></hugeicons-icon>
  </div>
  <h3 class="m02-gifts__title">{{ info.gifts.title }}</h3>
  <p class="m02-gifts__desc">{{ info.gifts.description }}</p>
  <p class="m02-gifts__note">{{ info.gifts.note }}</p>
  <div class="m02-gifts__envelope" aria-hidden="true">
    <hugeicons-icon
      [icon]="icons.envelope"
      [size]="28"
      color="currentColor"
      [strokeWidth]="1.4"
    ></hugeicons-icon>
  </div>
</div>
