<section class="m02-footer">
  <img [src]="assets.eucalyptusInvite" alt="" class="m02-botanical m02-botanical--footer" aria-hidden="true" />
  <p class="m02-closing">
    <span>{{ info.closing.line1 }}</span>
    <span>{{ info.closing.line2 }}</span>
  </p>

  <div class="m02-photo-frame m02-photo-frame--full">
    <div class="m02-torn-container m02-torn-container--photo m02-torn-container--top">
      <div class="m02-torn-container__shadow" aria-hidden="true"></div>
      <div class="m02-torn-container__content">
        <img [src]="info.images.footer" alt="Foto de despedida" class="m02-photo" />
      </div>
    </div>
  </div>
</section>
