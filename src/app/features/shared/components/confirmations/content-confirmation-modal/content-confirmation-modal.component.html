<!-- Paso 1: Confirmar asistencia -->
<div *ngIf="currentStep === 'confirmation'" class="step-content">
    <h5 class="text-heading font-bold text-[25px] text-center">¿Asistes a nuestra boda?</h5>

    <div class="mb-4 flex flex-col gap-5 mt-6 items-center justify-center">
        <div class="">
            <label class="inline-flex items-center space-x-2 mr-4 cursor-pointer">
                <input type="radio" name="respuesta" [value]="true"
                    (change)="isConfirmed = true; onConfirmChange()"
                    [checked]="isConfirmed === true"
                    class="form-radio text-primary" />
                <span class="text-theme-text text-lg">¡Sí! Confirmo</span>
            </label>

            <label class="inline-flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="respuesta" [value]="false"
                    (change)="isConfirmed = false; onConfirmChange()"
                    [checked]="isConfirmed === false"
                    class="form-radio text-primary" />
                <span class="text-theme-text text-lg">No puedo :(</span>
            </label>
        </div>
    </div>
</div>

<!-- Paso intermedio: Confirmar que no puede asistir -->
<app-confirm-alert
    *ngIf="currentStep === 'decline-confirmation'"
    title="¿Estás seguro de no asistir?"
    message="Al confirmar que no puedes asistir, ya no podrás modificar esta decisión después."
    secondaryMessage="¿Deseas continuar?"
    confirmLabel="Sí, confirmo que no asistiré"
    cancelLabel="Cancelar"
    (confirm)="confirmDecline()"
    (cancel)="cancelDecline()" />

<!-- Paso intermedio: Confirmar registro con cupos sin usar -->
<app-confirm-alert
    *ngIf="currentStep === 'partial-quotas-confirmation'"
    title="¿Confirmar registro?"
    [message]="partialQuotasMessage"
    secondaryMessage="No podrás modificar esto después. ¿Deseas continuar?"
    confirmLabel="Sí, confirmar"
    cancelLabel="Cancelar"
    (confirm)="confirmPartialSend()"
    (cancel)="cancelPartialSend()" />

<!-- Paso 2: Animación de carga -->
<div *ngIf="currentStep === 'loading'" class="step-content flex flex-col items-center justify-center py-12">
    <div class="loading-spinner mb-6"></div>
    <p class="text-theme-text text-lg md:text-xl font-cookie">Cargando...</p>
</div>

<!-- Paso 3: Ingresar acompañantes -->
<div *ngIf="currentStep === 'guests'" class="step-content">
    <!-- Mensaje de bienvenida con el nombre del anfitrión -->
    <div *ngIf="hostName" class="mb-4 text-center">
        <p class="text-heading text-xl md:text-2xl lg:text-3xl font-cookie mb-2">
            ¡Bienvenido {{ hostName }}!
        </p>
        <p class="text-theme-text text-sm md:text-base">
            Ingresa tus acompañantes
        </p>
    </div>

    <form class="mb-4 flex flex-col gap-4 items-center justify-center" (ngSubmit)="confirmSend()">
        <!-- Input solo si no se alcanzaron los cupos (considerando que el anfitrión ocupa un cupo) -->
        <div class="w-full flex flex-col gap-1" *ngIf="canAddMoreGuests">
            <input type="text" [(ngModel)]="nameCurrent" placeholder="Nombre del acompañante"
                class="border border-gray-300 rounded p-2 w-full mb-2 outline-none text-theme-text" name="nombre" />
            <button type="button" (click)="saveName()"
                class="bg-white text-theme-text px-4 py-2 rounded-[50px] outline-none transition-all hover:bg-primary-soft hover:text-white w-full font-bold cursor-pointer">
                Guardar
            </button>
        </div>

        <!-- Lista de nombres -->
        <div class="w-full">
            <p class="text-sm text-gray-600 mt-4">Lista de acompañantes ({{ listName.length }}/{{ maximumQuotas }}):</p>
            <p class="text-sm text-gray-600">Máximo {{ maximumQuotas }} acompañantes.</p>
            <ul class="mt-4 space-y-2 text-gray-700">
                <li *ngFor="let nombre of listName; let i = index" class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <p class="text-[28px] font-cookie text-theme-text font-medium capitalize">{{ nombre }}</p>
                        <!-- Mostrar badge "Asignado" si es el anfitrión -->
                        <span *ngIf="nombre === hostName" class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">
                            Asignado
                        </span>
                    </div>
                    <!-- Solo mostrar botón eliminar si NO es el anfitrión -->
                    <button *ngIf="nombre !== hostName" type="button" (click)="deleteName(i)"
                        class="text-primary-soft text-sm hover:underline cursor-pointer">
                        Eliminar
                    </button>
                </li>
            </ul>

            <!-- Botón enviar cuando hay al menos el anfitrión guardado -->
            <div *ngIf="listName.length > 0" class="mt-4">
                <button type="submit"
                    class="bg-primary text-white px-4 py-2 hover:bg-primary-soft cursor-pointer w-full font-bold rounded-[50px] outline-none transition-all">
                    Enviar
                </button>
            </div>
        </div>
    </form>

    <!-- Mensaje si ya se envió -->
    <div *ngIf="registrationSent" class="text-green-700 text-sm mt-4 text-center">
        Registro enviado correctamente.
    </div>
</div>
