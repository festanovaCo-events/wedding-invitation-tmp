<div class="fixed inset-0 bg-primary/70 backdrop-blur-sm flex items-center justify-center z-[9999] modal-backdrop"
    *ngIf="show" (click)="onBackdropClick($event)">
    <div class="bg-surface-alt rounded-3xl md:rounded-full shadow-2xl p-6 md:p-12 max-w-[90vw] w-[90vw] max-h-[90vh] h-auto md:w-[600px] md:h-[600px] relative flex flex-col items-center justify-start pt-12 md:pt-16 overflow-visible app-animated app-zoom-in"
        [class.app-zoom-in]="show" (click)="$event.stopPropagation()">
        <!-- Close button -->
        <button
            class="absolute top-4 right-4 md:top-5 md:right-5 w-10 h-10 md:w-12 md:h-12 rounded-full bg-primary hover:bg-primary-soft active:bg-primary-soft flex items-center justify-center text-white font-bold transition-colors z-[100] shadow-lg"
            (click)="onClose()" aria-label="Cerrar" type="button">
            <span class="text-2xl md:text-3xl leading-none font-bold">&times;</span>
        </button>

        <!-- Icon -->
        <div class="w-28 h-28 md:w-32 md:h-32 mb-4 md:mb-6 mt-4 md:mt-6">
            <div
                class="w-full h-full rounded-full bg-white border border-gray-300 flex items-center justify-center shadow-sm">
                <ng-content select="[icon]"></ng-content>
            </div>
        </div>

        <!-- Title -->
        <h3 class="text-heading font-bold text-xl md:text-3xl mb-4 md:mb-8 text-center px-4">{{ title }}</h3>

        <!-- Content -->
        <div
            class="flex-1 flex items-start justify-center w-full px-4 md:px-8 pb-6 md:pb-8 overflow-y-auto overflow-x-hidden max-h-[50vh] md:max-h-[60%]">
            <ng-content></ng-content>
        </div>
    </div>
</div>
