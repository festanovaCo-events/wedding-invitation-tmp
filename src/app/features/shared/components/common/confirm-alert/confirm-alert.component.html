<div class="step-content">
  <h5 class="text-heading font-bold text-[25px] md:text-[28px] text-center mb-6 mt-2">{{ title }}</h5>

  <div class="mb-8 text-center" *ngIf="message || secondaryMessage">
    <p *ngIf="message" class="text-theme-text text-base md:text-lg mb-2">{{ message }}</p>
    <p *ngIf="secondaryMessage" class="text-primary-soft text-sm md:text-base font-semibold">
      {{ secondaryMessage }}
    </p>
  </div>

  <div class="flex flex-col gap-4 items-center justify-center">
    <button
      type="button"
      (click)="confirm.emit()"
      class="bg-primary hover:bg-primary-soft text-white px-6 py-3 rounded-[50px] font-bold transition-all cursor-pointer w-full max-w-xs shadow-md">
      {{ confirmLabel }}
    </button>

    <button
      type="button"
      (click)="cancel.emit()"
      class="bg-white hover:bg-primary hover:text-white text-theme-text px-6 py-3 rounded-[50px] font-bold transition-all cursor-pointer w-full max-w-xs border border-primary">
      {{ cancelLabel }}
    </button>
  </div>
</div>
